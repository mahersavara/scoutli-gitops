apiVersion: v1
kind: Secret
metadata:
  name: scoutli-db-credentials
  namespace: default # Job sẽ chạy ở namespace default hoặc scoutli-app
type: Opaque
stringData: # Kubernetes sẽ tự động base64 encode các giá trị này
  DB_HOST: "<your-rds-endpoint>.rds.amazonaws.com"
  DB_PORT: "5432"
  DB_USER: "scoutli_admin"
  DB_PASSWORD: "<set-locally-never-commit>"
